<!DOCTYPE html>
<html>
<head>
    <title>Inquiry Form</title>
</head>
<body>

<h2>Inquiry Form</h2>

<form id="inquiryForm" action="https://script.google.com/macros/s/AKfycbxuvDItqC7Jpe589wzsVLWX53mV351HwQOu_N1hKvOf2k0_IBAacvNjLaC0Kgnmweok1A/exec">
    <input type="text" id="name" placeholder="Name" required><br><br>

    <input type="email" id="email" placeholder="Email" required><br><br>

    <textarea id="message" placeholder="Message" required></textarea><br><br>

    <button type="submit">Submit</button>
</form>

<p id="status"></p>

<script>
document.getElementById("inquiryForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
    };

    const response = await fetch("https://script.google.com/macros/s/AKfycbxuvDItqC7Jpe589wzsVLWX53mV351HwQOu_N1hKvOf2k0_IBAacvNjLaC0Kgnmweok1A/exec", {
        method: "POST",
        body: JSON.stringify(data)
    });

    document.getElementById("status").innerText =
        "Inquiry submitted successfully!";
});
</script>

</body>
</html>
